services:
  - type: web
    name: merkato-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3000,https://merkato-fund-frontend.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: merkato-db
          property: connectionString
      - key: STRAPI_BASE_URL
        value: https://merkato-strapi.onrender.com
      - key: STRAPI_API_TOKEN
        sync: false
  - type: web
    name: merkato-strapi
    runtime: node
    rootDir: strapi-cms
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /_health
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_HOST
        fromDatabase:
          name: merkato-strapi-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: merkato-strapi-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: merkato-strapi-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: merkato-strapi-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: merkato-strapi-db
          property: password
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://merkato-backend.onrender.com

databases:
  - name: merkato-db
    databaseName: merkato
    user: merkato
    plan: free
  - name: merkato-strapi-db
    databaseName: strapi
    user: strapi
    plan: free
